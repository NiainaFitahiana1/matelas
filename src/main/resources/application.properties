spring.application.name=matelas

# URL de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matelas

# Nom d'utilisateur et mot de passe
spring.datasource.username=postgres
spring.datasource.password=4528800

# Pilote JDBC pour PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

spring.jpa.properties.hibernate.jdbc.batch_size=500000
spring.jpa.properties.hibernate.order_inserts=true 
spring.jpa.properties.hibernate.order_updates=true  
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

